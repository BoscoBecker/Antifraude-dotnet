# RabbitMQ + Management UI — rede antifraud-net (externa; criada pelo compose Postgres)
#
# AMQP (host): localhost:5672
# Management: http://localhost:15672
# Credenciais: docker/rabbitmq/.env (RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS)

services:
  my-rabbitmq:
    container_name: my-rabbitmq
    image: rabbitmq:3-management
    networks:
      - antifraud-net
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Defina RABBITMQ_DEFAULT_USER em docker/rabbitmq/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Defina RABBITMQ_DEFAULT_PASS em docker/rabbitmq/.env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  rabbitmq_data:

networks:
  antifraud-net:
    external: true
    name: antifraud-net
